<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9ccfe0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="推しカレンダー">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>推しカレンダー</title>
<style>
:root{--b:#9ccfe0;--i:#344b55;--l:#d9edf3}
*{box-sizing:border-box}body{margin:0;background:#f4fbfd;color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
.app{padding-bottom:90px}header{background:#fff;padding:30px 18px 12px;border-bottom:1px solid var(--l);position:sticky;top:0;z-index:5}
h1{margin:0 0 16px;color:#82bfd4;font-size:28px}.tabs,.filters{display:flex;gap:8px;overflow:auto}
.tab,.filter,.small{white-space:nowrap;border:0;background:#edf7fa;color:#668793;padding:10px 15px;border-radius:22px}
.tab{cursor:pointer}.active{background:var(--b)!important;color:#fff!important}
main{padding:18px}.panel{background:#fff;border-radius:22px;padding:18px;margin-bottom:15px;box-shadow:0 7px 25px #b8dce544}
h2{margin:0 0 15px}.month{display:flex;align-items:center;justify-content:space-between}
.month button{background:#edf7fa;border:0;border-radius:12px;padding:8px 14px}.week,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.week div{text-align:center;font-size:12px;color:#8aa1a8;padding:5px}.day{min-height:65px;background:#f8fcfd;border:1px solid #e6f3f6;border-radius:10px;padding:5px}
.today{outline:2px solid var(--b)}.ev{display:block;background:#d9eef5;border-radius:6px;padding:3px;font-size:10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.item{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--l)}.thumb,.person img{width:55px;height:55px;border-radius:14px;object-fit:cover;background:#e8f5f8;flex:none}
.itembody{flex:1}.star{float:right;border:0;background:none;font-size:25px;color:#9bb1b8}.star.on{color:#e5b94f}
.badge{display:inline-block;background:#edf7fa;padding:4px 7px;border-radius:9px;font-size:11px;margin:3px}
.muted{color:#718990;font-size:13px}.fab{position:fixed;right:20px;bottom:22px;width:62px;height:62px;border:0;border-radius:50%;background:var(--b);color:#fff;font-size:34px;box-shadow:0 8px 25px #8fbfd055;z-index:10}
.modalbg{display:none;position:fixed;inset:0;background:#0005;z-index:20;overflow:auto}.modalbg.show{display:block}
.modal{background:#fff;max-width:650px;margin:12px auto;padding:20px;border-radius:24px}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}input,select,textarea{width:100%;padding:10px;border:1px solid #cfe5eb;border-radius:11px;background:#fbfeff;color:var(--i)}
textarea{min-height:75px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions{display:flex;gap:8px;margin-top:18px}
.primary,.secondary,.danger{border:0;padding:12px;border-radius:11px}.primary{background:var(--b);color:#fff;flex:1}.secondary{background:#edf7fa;color:#668793}.danger{background:#fff0f0;color:#a66}
.section{border-top:1px solid var(--l);margin-top:16px;padding-top:10px}.person{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--l)}
.person img{width:60px;height:60px}.personbody{flex:1;min-width:0}.personactions{display:flex;gap:4px}.personactions button{border:0;background:#edf7fa;color:#668793;border-radius:9px;padding:7px 8px}.personactions .dangerMini{background:#fff0f0;color:#a66}
.tour{background:#f7fcfd;border-radius:15px;padding:12px;margin:8px 0}
@media(max-width:600px){.modal{margin:8px}.g2{grid-template-columns:1fr 1fr}.personactions button{padding:7px 6px}}
</style>
</head>
<body>
<div class="app">
<header>
<h1>推しカレンダー</h1>
<div class="tabs">
<button type="button" class="tab active" data-v="cal">カレンダー</button>
<button type="button" class="tab" data-v="list">予定一覧</button>
<button type="button" class="tab" data-v="people">人物・作品</button>
<button type="button" class="tab" data-v="tours">ツアー</button>
</div>
</header>
<main id="main"></main>
<button type="button" class="fab" id="fab">＋</button>
</div>
<div class="modalbg" id="mb"><div class="modal" id="modal"></div></div>

<script>
"use strict";

const KEY="oshiCal2";
let S;
try{S=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){S={}};
S.events=Array.isArray(S.events)?S.events:[];
S.people=Array.isArray(S.people)?S.people:[];
S.tours=Array.isArray(S.tours)?S.tours:[];
if(!S.people.some(p=>p.id==="other"))S.people.unshift({id:"other",name:"その他",photo:""});
S.people.forEach((p,i)=>{if(typeof p.order!=="number")p.order=i});
S.people.sort((a,b)=>a.order-b.order);

let V="cal";
let M=new Date(new Date().getFullYear(),new Date().getMonth(),1);
let F="all";

const C=["ライブ","イベント","物販","映画","交通","宿泊","その他"];
const T=["チケット未予約・未購入","チケット予約済み（当落待ち）","チケット確保・購入済","チケット未発券","発券済"];

const main=document.getElementById("main");
const mb=document.getElementById("mb");
const modalEl=document.getElementById("modal");

function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function today(){return new Date().toISOString().slice(0,10)}
function pn(id){return S.people.find(p=>p.id===id)?.name||"その他"}
function pp(id){return S.people.find(p=>p.id===id)?.photo||""}
function rd(id){return document.getElementById(id)?.value||""}
function persist(){S.people.forEach((p,i)=>p.order=i);localStorage.setItem(KEY,JSON.stringify(S))}
function save(){persist();render()}
function modal(h){modalEl.innerHTML=h;mb.classList.add("show")}
function closeM(){mb.classList.remove("show")}

document.querySelectorAll(".tab").forEach(btn=>{
  btn.addEventListener("click",()=>{
    V=btn.dataset.v;
    render();
    window.scrollTo({top:0,behavior:"smooth"});
  });
});
document.getElementById("fab").addEventListener("click",()=>eventForm());
mb.addEventListener("click",e=>{if(e.target===mb)closeM()});

function render(){
 document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.v===V));
 if(V==="cal")calendar();
 else if(V==="list")list();
 else if(V==="people")people();
 else if(V==="tours")tours();
}

function calendar(){
 const y=M.getFullYear(),m=M.getMonth(),first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();
 let h=`<div class="panel"><div class="month"><button type="button" id="prevMonth">‹</button><h2>${y}年${m+1}月</h2><button type="button" id="nextMonth">›</button></div><div class="week">${"日月火水木金土".split("").map(x=>`<div>${x}</div>`).join("")}</div><div class="cal">`;
 for(let i=0;i<first;i++)h+="<div></div>";
 for(let d=1;d<=last;d++){
   const date=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
   const es=S.events.filter(e=>e.date===date);
   h+=`<div class="day ${date===today()?"today":""}"><b>${d}</b>${es.slice(0,3).map(e=>`<span class="ev">${esc(e.title)}</span>`).join("")}</div>`;
 }
 h+="</div></div>";
 main.innerHTML=h;
 document.getElementById("prevMonth").onclick=()=>{M.setMonth(M.getMonth()-1);render()};
 document.getElementById("nextMonth").onclick=()=>{M.setMonth(M.getMonth()+1);render()};
}

function list(){
 const fs=[["all","すべて"],["unfinished","終わってない"],["star","★ お気に入り"],["go","行く"],["interest","気になる"],...T.map((x,i)=>["t"+i,x])];
 let es=S.events.filter(e=>F==="all"||(F==="unfinished"&&e.date>=today())||(F==="star"&&e.star)||(F==="go"&&e.go)||(F==="interest"&&e.interest)||(F.startsWith("t")&&e.ticket===T[Number(F.slice(1))])).sort((a,b)=>a.date.localeCompare(b.date));
 let h=`<div class="panel"><h2>予定一覧</h2><div class="filters">${fs.map(x=>`<button type="button" class="filter ${F===x[0]?"active":""}" data-filter="${x[0]}">${x[1]}</button>`).join("")}</div>`;
 if(!es.length)h+=`<p class="muted" style="text-align:center;padding:35px">該当する予定はありません</p>`;
 es.forEach(e=>{
   const img=e.icon||pp(e.person);
   h+=`<div class="item"><img class="thumb" src="${img||'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2255%22 height=%2255%22%3E%3Crect width=%2255%22 height=%2255%22 rx=%2214%22 fill=%22%23e8f5f8%22/%3E%3C/svg%3E'}"><div class="itembody"><button type="button" class="star ${e.star?"on":""}" data-star="${e.id}">${e.star?"★":"☆"}</button><b>${esc(e.title)}</b><div class="muted">${e.date}${e.time?" "+e.time:""} ・ ${esc(pn(e.person))}</div><span class="badge">${esc(e.cat)}</span>${e.ticket?`<span class="badge">${esc(e.ticket)}</span>`:""}${e.go?'<span class="badge">行く ✓</span>':""}${e.interest?'<span class="badge">気になる</span>':""}<br><button type="button" class="small" data-edit="${e.id}">詳細・編集</button></div></div>`;
 });
 h+="</div>";
 main.innerHTML=h;
 main.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{F=b.dataset.filter;render()});
 main.querySelectorAll("[data-star]").forEach(b=>b.onclick=()=>{let e=S.events.find(x=>x.id===b.dataset.star);if(e){e.star=!e.star;save()}});
 main.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>eventForm(b.dataset.edit));
}

function people(){
 let h=`<div class="panel"><div class="month"><h2>人物・作品</h2><button type="button" class="small" id="addPerson">＋追加</button></div>`;
 S.people.forEach((p,i)=>{
   const img=p.photo||'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2260%22 height=%2260%22%3E%3Crect width=%2260%22 height=%2260%22 rx=%2214%22 fill=%22%23e8f5f8%22/%3E%3C/svg%3E';
   h+=`<div class="person"><img src="${img}"><div class="personbody"><b>${esc(p.name)}</b><div class="muted">${S.events.filter(e=>e.person===p.id).length}件</div></div><div class="personactions">${i>1?`<button type="button" data-up="${p.id}">↑</button>`:""}${i<S.people.length-1?`<button type="button" data-down="${p.id}">↓</button>`:""}${p.id!=="other"?`<button type="button" data-person-edit="${p.id}">変更</button><button type="button" class="dangerMini" data-person-delete="${p.id}">削除</button>`:""}</div></div>`;
 });
 h+=`<p class="muted" style="margin-top:12px">↑↓で並び替え。「その他」は削除・変更できません。</p></div>`;
 main.innerHTML=h;
 document.getElementById("addPerson").onclick=()=>personForm();
 main.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>movePerson(b.dataset.up,-1));
 main.querySelectorAll("[data-down]").forEach(b=>b.onclick=()=>movePerson(b.dataset.down,1));
 main.querySelectorAll("[data-person-edit]").forEach(b=>b.onclick=()=>personForm(b.dataset.personEdit));
 main.querySelectorAll("[data-person-delete]").forEach(b=>b.onclick=()=>deletePerson(b.dataset.personDelete));
}

function movePerson(id,dir){
 const i=S.people.findIndex(p=>p.id===id),j=i+dir;
 if(i<1||j<1||j>=S.people.length)return;
 [S.people[i],S.people[j]]=[S.people[j],S.people[i]];
 save();
}

function personForm(id){
 const p=id?S.people.find(x=>x.id===id):{name:"",photo:""};
 modal(`<h2>${id?"人物・作品を変更":"人物・作品を追加"}</h2><label>名前 *</label><input id="pn" value="${esc(p.name)}"><label>写真${id?"（変更しない場合は未選択）":""}</label><input id="pf" type="file" accept="image/*"><div class="actions"><button type="button" class="secondary" id="cancelM">キャンセル</button><button type="button" class="primary" id="saveP">保存</button></div>`);
 document.getElementById("cancelM").onclick=closeM;
 document.getElementById("saveP").onclick=()=>savePerson(id||"");
}

async function fileData(f){
 return new Promise(resolve=>{if(!f)return resolve("");const r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(f)});
}
async function savePerson(id){
 const n=rd("pn").trim();
 if(!n)return alert("名前を入力してください");
 const f=document.getElementById("pf")?.files?.[0];
 const photo=await fileData(f);
 if(id){
   const p=S.people.find(x=>x.id===id);
   if(!p||p.id==="other")return;
   p.name=n;
   if(f)p.photo=photo;
 }else{
   S.people.push({id:crypto.randomUUID(),name:n,photo:photo||"",order:S.people.length});
 }
 closeM();save();
}
function deletePerson(id){
 const p=S.people.find(x=>x.id===id);if(!p||id==="other")return;
 const count=S.events.filter(e=>e.person===id).length;
 const msg=count?`${p.name}を削除しますか？\nこの人物の予定${count}件は削除せず「その他」に変更します。`:`${p.name}を削除しますか？`;
 if(!confirm(msg))return;
 S.events.forEach(e=>{if(e.person===id)e.person="other"});
 S.people=S.people.filter(x=>x.id!==id);
 save();
}

function tours(){
 let h=`<div class="panel"><div class="month"><h2>ツアー</h2><button type="button" class="small" id="addTour">＋追加</button></div>`;
 S.tours.forEach(t=>{const es=S.events.filter(e=>e.tour===t.id).sort((a,b)=>a.date.localeCompare(b.date));h+=`<div class="tour"><b>${esc(t.name)}</b>${es.map(e=>`<div>${e.date}　${esc(e.title)}</div>`).join("")||"<span class=muted>公演予定を登録すると集約されます</span>"}</div>`});
 if(!S.tours.length)h+=`<p class="muted">ツアーはまだありません</p>`;
 h+="</div>";main.innerHTML=h;
 document.getElementById("addTour").onclick=()=>tourForm();
}
function tourForm(){
 modal(`<h2>ツアーを追加</h2><label>ツアー名 *</label><input id="tn"><div class="actions"><button type="button" class="secondary" id="cancelM">キャンセル</button><button type="button" class="primary" id="saveT">保存</button></div>`);
 document.getElementById("cancelM").onclick=closeM;document.getElementById("saveT").onclick=saveTour;
}
function saveTour(){const n=rd("tn").trim();if(!n)return alert("ツアー名を入力してください");S.tours.push({id:crypto.randomUUID(),name:n});closeM();save()}

function eventForm(id){
 const e=id?S.events.find(x=>x.id===id):{id:"",title:"",person:"other",cat:"ライブ",date:today(),time:"",official:"",x:"",insta:"",star:false,go:false,interest:false,ticket:T[0],type:"",tour:"",venue:"",doors:"",start:"",apps:[]};
 const po=S.people.map(p=>`<option value="${p.id}" ${p.id===e.person?"selected":""}>${esc(p.name)}</option>`).join("");
 const to=`<option value="">なし</option>`+S.tours.map(t=>`<option value="${t.id}" ${t.id===e.tour?"selected":""}>${esc(t.name)}</option>`).join("");
 modalEl.dataset.id=e.id;
 modal(`<h2>${id?"予定を編集":"予定を追加"}</h2><label>タイトル *</label><input id="title" value="${esc(e.title)}"><div class="g2"><div><label>人物・作品</label><select id="person">${po}</select></div><div><label>カテゴリ</label><select id="cat">${C.map(c=>`<option ${c===e.cat?"selected":""}>${c}</option>`).join("")}</select></div></div><div class="g2"><div><label>日付 *</label><input id="date" type="date" value="${e.date}"></div><div><label>時刻</label><input id="time" type="time" value="${e.time}"></div></div><div id="fields"></div><div class="section"><label>画像（最大3枚）</label><input id="imgs" type="file" accept="image/*" multiple><div class="muted">予定ごとの画像があれば人物写真より優先表示します。</div></div><div class="g2"><div><label>公式URL</label><input id="official" type="url" value="${esc(e.official)}"></div><div><label>X URL</label><input id="x" type="url" value="${esc(e.x)}"></div></div><label>Instagram URL</label><input id="insta" type="url" value="${esc(e.insta)}"><div class="g2"><div><label>お気に入り</label><select id="star"><option value="0">☆</option><option value="1" ${e.star?"selected":""}>★</option></select></div><div><label>行く／気になる</label><select id="flag"><option>未設定</option><option ${e.go?"selected":""}>行く</option><option ${e.interest?"selected":""}>気になる</option></select></div></div><label>メモ</label><textarea id="notes">${esc(e.notes)}</textarea><div class="actions"><button type="button" class="secondary" id="cancelM">キャンセル</button><button type="button" class="primary" id="saveE">保存</button>${id?`<button type="button" class="danger" id="deleteE">削除</button>`:""}</div>`);
 window.E=e;
 document.getElementById("cat").onchange=fields;
 document.getElementById("cancelM").onclick=closeM;
 document.getElementById("saveE").onclick=saveEvent;
 if(id)document.getElementById("deleteE").onclick=()=>delEvent(id);
 fields();
}
function fields(){
 const e=window.E,c=rd("cat");let h="";
 if(c==="ライブ")h=`<div class="section"><h3>ライブ情報</h3><div class="g2"><div><label>会場</label><input id="venue" value="${esc(e.venue)}"></div><div><label>ツアー</label><select id="tour">${`<option value="">なし</option>`+S.tours.map(t=>`<option value="${t.id}" ${t.id===e.tour?"selected":""}>${esc(t.name)}</option>`).join("")}</select></div><div><label>開場時間</label><input id="doors" type="time" value="${e.doors}"></div><div><label>開演時間</label><input id="start" type="time" value="${e.start}"></div></div><label>申し込み期間（最大5回）</label><div id="apps">${(e.apps||[]).map((a,i)=>app(a,i)).join("")}</div><button type="button" class="small" id="addApp">＋申し込み期間を追加</button><div class="g2"><div><label>チケット状態</label><select id="ticket">${T.map(x=>`<option ${x===e.ticket?"selected":""}>${x}</option>`).join("")}</select></div><div><label>紙／電子</label><select id="type"><option value="">未設定</option><option ${e.type==="電子"?"selected":""}>電子</option><option ${e.type==="紙"?"selected":""}>紙</option></select></div></div><div id="ticketExtra"></div></div>`;
 else if(c==="映画")h=`<div class="section"><label>公開日</label><input id="release" type="date" value="${e.release||e.date}"><label>劇場・上映メモ</label><input id="venue" value="${esc(e.venue)}"></div>`;
 else if(c==="交通")h=`<div class="section"><div class="g2"><div><label>往路／復路</label><select id="direction"><option>往路</option><option ${e.direction==="復路"?"selected":""}>復路</option></select></div><div><label>移動手段</label><input id="transport" value="${esc(e.transport)}"></div><div><label>出発地</label><input id="from" value="${esc(e.from)}"></div><div><label>到着地</label><input id="to" value="${esc(e.to)}"></div><div><label>便名・列車名</label><input id="route" value="${esc(e.route)}"></div><div><label>座席</label><input id="seat" value="${esc(e.seat)}"></div></div></div>`;
 else if(c==="宿泊")h=`<div class="section"><label>ホテル名</label><input id="hotel" value="${esc(e.hotel)}"><div class="g2"><div><label>チェックイン</label><input id="checkin" type="datetime-local" value="${e.checkin||""}"></div><div><label>チェックアウト</label><input id="checkout" type="datetime-local" value="${e.checkout||""}"></div></div><label>予約URL</label><input id="booking" type="url" value="${esc(e.booking)}"></div>`;
 document.getElementById("fields").innerHTML=h;
 if(c==="ライブ"){document.getElementById("addApp").onclick=addApp;document.getElementById("type").onchange=ticketFields;ticketFields()}
}
function app(a={},i=0){return `<div class="tour"><b>申し込み ${i+1}</b><div class="g2"><div><label>タイトル</label><input class="at" value="${esc(a.title)}"></div><div><label>開始</label><input class="as" type="datetime-local" value="${a.start||""}"></div><div><label>終了</label><input class="ae" type="datetime-local" value="${a.end||""}"></div><div><label>当落日時</label><input class="ar" type="datetime-local" value="${a.result||""}"></div></div></div>`}
function addApp(){const n=document.querySelectorAll("#apps .tour").length;if(n>=5)return alert("最大5件です");document.getElementById("apps").insertAdjacentHTML("beforeend",app({},n))}
function ticketFields(){
 const t=rd("type"),e=window.E,h=document.getElementById("ticketExtra");
 h.innerHTML=t==="電子"?`<label>電子チケットURL</label><input id="ticketUrl" type="url" value="${esc(e.ticketUrl)}">`:t==="紙"?`<div class="g2"><div><label>発券開始</label><input id="issueStart" type="datetime-local" value="${e.issueStart||""}"></div><div><label>発券終了</label><input id="issueEnd" type="datetime-local" value="${e.issueEnd||""}"></div></div><label><input id="issued" type="checkbox" style="width:auto" ${e.issued?"checked":""}> 発券済み</label>`:"";
}
async function saveEvent(){
 const e=window.E||{},id=modalEl.dataset.id,files=[...(document.getElementById("imgs")?.files||[])].slice(0,3),pics=[];
 for(const f of files)pics.push(await fileData(f));
 const flag=rd("flag");
 const n={...e,id:id||crypto.randomUUID(),title:rd("title").trim(),person:rd("person"),cat:rd("cat"),date:rd("date"),time:rd("time"),official:rd("official"),x:rd("x"),insta:rd("insta"),star:rd("star")==="1",go:flag==="行く",interest:flag==="気になる",notes:rd("notes"),icon:e.icon||"",images:pics.length?pics:(e.images||[])};
 if(!n.title||!n.date)return alert("タイトルと日付は入力してください");
