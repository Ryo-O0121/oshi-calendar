<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9ccfe0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="推しカレンダー">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>推しカレンダー</title>

<style>
:root{--b:#9ccfe0;--i:#344b55;--l:#d9edf3}
*{box-sizing:border-box}
body{margin:0;background:#f4fbfd;color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
.app{padding-bottom:90px}
header{background:#fff;padding:30px 18px 12px;border-bottom:1px solid var(--l);position:sticky;top:0;z-index:5}
h1{margin:0 0 16px;color:#82bfd4;font-size:28px}
.tabs{display:flex;gap:8px;overflow:auto}
.tab{white-space:nowrap;border:0;background:#edf7fa;color:#668793;padding:10px 15px;border-radius:22px;cursor:pointer}
.active{background:var(--b)!important;color:#fff!important}
main{padding:18px}
.panel{background:#fff;border-radius:22px;padding:18px;margin-bottom:15px;box-shadow:0 7px 25px #b8dce544}
.week,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.week div{text-align:center;font-size:12px;color:#8aa1a8;padding:5px}
.day{min-height:65px;background:#f8fcfd;border:1px solid #e6f3f6;border-radius:10px;padding:5px}
.today{outline:2px solid var(--b)}
.ev{display:block;background:#d9eef5;border-radius:6px;padding:3px;font-size:10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.item{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--l)}
.thumb{width:55px;height:55px;border-radius:14px;object-fit:cover;background:#e8f5f8;flex:none}
.itembody{flex:1}
.badge{display:inline-block;background:#edf7fa;padding:4px 7px;border-radius:9px;font-size:11px;margin:3px}
.muted{color:#718990;font-size:13px}
.fab{position:fixed;right:20px;bottom:22px;width:62px;height:62px;border:0;border-radius:50%;background:var(--b);color:#fff;font-size:34px;box-shadow:0 8px 25px #8fbfd055;z-index:10}
.modalbg{display:none;position:fixed;inset:0;background:#0005;z-index:20;overflow:auto}
.modalbg.show{display:block}
.modal{background:#fff;max-width:650px;margin:12px auto;padding:20px;border-radius:24px}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}
input,select,textarea{width:100%;padding:10px;border:1px solid #cfe5eb;border-radius:11px;background:#fbfeff;color:var(--i)}
textarea{min-height:75px}
.actions{display:flex;gap:8px;margin-top:18px}
.primary{border:0;padding:12px;border-radius:11px;background:var(--b);color:#fff;flex:1}
.secondary{border:0;padding:12px;border-radius:11px;background:#edf7fa;color:#668793}
</style>
</head>

<body>
<div class="app">
<header>
<h1>推しカレンダー</h1>
<div class="tabs">
<button type="button" class="tab active" data-v="cal">カレンダー</button>
<button type="button" class="tab" data-v="list">予定一覧</button>
<button type="button" class="tab" data-v="people">人物・作品</button>
<button type="button" class="tab" data-v="tours">ツアー</button>
</div>
</header>

<main id="main"></main>
<button type="button" class="fab" id="fab">＋</button>
</div>

<div class="modalbg" id="mb"><div class="modal" id="modal"></div></div>
<script type="module">
import { loadState, saveState } from "./db.js";

let S = await loadState();
if (!S || typeof S !== "object") S = {};
S.events = Array.isArray(S.events) ? S.events : [];
S.people = Array.isArray(S.people) ? S.people : [];
S.tours = Array.isArray(S.tours) ? S.tours : [];

if (!S.people.some(p => p.id === "other"))
  S.people.unshift({ id: "other", name: "その他", photo: "" });

async function persist() { await saveState(S); }
function save() { persist(); }

/* タブ切り替え */
document.querySelectorAll(".tab").forEach(t => {
  t.onclick = () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    t.classList.add("active");
    const v = t.dataset.v;
    if (v === "cal") calendar();
    if (v === "list") list();
    if (v === "people") people();
    if (v === "tours") tours();
  };
});

/* カレンダー */
function calendar() {
  const main = document.getElementById("main");
  const now = new Date();
  const y = now.getFullYear();
  const m = now.getMonth();
  const first = new Date(y, m, 1);
  const last = new Date(y, m + 1, 0);

  let html = `<div class="panel">
    <h2>${y}年 ${m + 1}月</h2>
    <div class="week">
      <div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div>
    </div>
    <div class="cal">`;

  for (let i = 0; i < first.getDay(); i++) html += `<div></div>`;

  for (let d = 1; d <= last.getDate(); d++) {
    const date = `${y}-${String(m + 1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const evs = S.events.filter(e => e.date === date);
    html += `<div class="day ${d === now.getDate() ? "today" : ""}">
      <div>${d}</div>
      ${evs.map(e => `<span class="ev">${e.title}</span>`).join("")}
    </div>`;
  }

  html += `</div></div>`;
  main.innerHTML = html;
}

/* 予定一覧 */
function list() {
  const main = document.getElementById("main");
  let html = `<div class="panel"><h2>予定一覧</h2>`;
  S.events.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{
    const p = S.people.find(x=>x.id===e.person)||{name:"不明"};
    html += `<div class="item">
      <img class="thumb" src="${p.photo||'icon-180.png'}">
      <div class="itembody">
        <b>${e.title}</b>
        <div class="muted">${e.date} ・ ${p.name}</div>
        <span class="badge">${e.cat}</span>
        ${e.ticket?`<span class="badge">${e.ticket}</span>`:""}
        ${e.go?`<span class="badge">行く ✓</span>`:""}
        ${e.interest?`<span class="badge">気になる</span>`:""}
        <br>
        <button type="button" class="secondary" data-edit="${e.id}">編集</button>
      </div>
    </div>`;
  });
  html += `</div>`;
  main.innerHTML = html;

  document.querySelectorAll("[data-edit]").forEach(b=>{
    b.onclick = ()=>eventForm(b.dataset.edit);
  });
}

/* 人物 */
function people() {
  const main = document.getElementById("main");
  let html = `<div class="panel"><h2>人物・作品</h2>`;
  S.people.forEach(p=>{
    html += `<div class="item">
      <img class="thumb" src="${p.photo||'icon-180.png'}">
      <div class="itembody"><b>${p.name}</b></div>
    </div>`;
  });
  html += `</div>`;
  main.innerHTML = html;
}

/* ツアー */
function tours() {
  const main = document.getElementById("main");
  let html = `<div class="panel"><h2>ツアー</h2>`;
  S.tours.forEach(t=>{
    html += `<div class="item"><div class="itembody">
      <b>${t.title}</b>
      <div class="muted">${t.start}〜${t.end}</div>
    </div></div>`;
  });
  html += `</div>`;
  main.innerHTML = html;
}
/* 予定フォーム */
function eventForm(id="") {
  const e = id ? S.events.find(x=>x.id===id) : {
    id: crypto.randomUUID(),
    title:"", date:"", person:"other",
    cat:"", ticket:"", place:"", memo:"",
    go:false, interest:false
  };

  let html = `
    <h2>${id?"予定を編集":"予定を追加"}</h2>

    <label>タイトル *</label>
    <input id="et" value="${e.title}">

    <label>日付 *</label>
    <input id="ed" type="date" value="${e.date}">

    <label>人物</label>
    <select id="ep">
      ${S.people.map(p=>`<option value="${p.id}" ${p.id===e.person?"selected":""}>${p.name}</option>`).join("")}
    </select>

    <label>カテゴリ</label>
    <input id="ec" value="${e.cat}">

    <label>チケット情報</label>
    <input id="tk" value="${e.ticket}">

    <label>場所</label>
    <input id="pl" value="${e.place}">

    <label>メモ</label>
    <textarea id="mm">${e.memo}</textarea>

    <label><input type="checkbox" id="go" ${e.go?"checked":""}> 行く</label>
    <label><input type="checkbox" id="in" ${e.interest?"checked":""}> 気になる</label>

    <div class="actions">
      <button type="button" class="secondary" id="cancelM">キャンセル</button>
      <button type="button" class="primary" id="saveE">保存</button>
    </div>
  `;

  modal(html);

  document.getElementById("cancelM").onclick = closeM;

  document.getElementById("saveE").onclick = ()=>{
    e.title = document.getElementById("et").value.trim();
    e.date = document.getElementById("ed").value;
    e.person = document.getElementById("ep").value;
    e.cat = document.getElementById("ec").value;
    e.ticket = document.getElementById("tk").value;
    e.place = document.getElementById("pl").value;
    e.memo = document.getElementById("mm").value;
    e.go = document.getElementById("go").checked;
    e.interest = document.getElementById("in").checked;

    if(!e.title || !e.date) return alert("タイトルと日付は必須です");

    if(!id) S.events.push(e);

    save();
    list();
    closeM();
  };
}
/* モーダル */
function modal(html){
  const mb=document.getElementById("mb");
  const m=document.getElementById("modal");
  m.innerHTML=html;
  mb.classList.add("show");
}
function closeM(){
  document.getElementById("mb").classList.remove("show");
}

/* ＋ボタン */
document.getElementById("fab").onclick = () => eventForm();

/* 初期表示 */
calendar();
</script>
<script src="db.js"></script>
<script src="script.js"></script>
</body>
</html>
