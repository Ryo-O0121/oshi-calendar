<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>推しカレンダー</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<meta name="theme-color" content="#fff">
<style>
:root{--blue:#9FC9DA;--dark:#4f6974;--bg:#f4fbfd;--card:#fff}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:var(--bg);color:#344850}header{padding:22px 18px 12px;background:#fff;position:sticky;top:0;z-index:2;border-bottom:1px solid #e5f0f3}h1{margin:0;font-size:24px;color:#86bccf}.tabs{display:flex;gap:8px;padding:12px;overflow:auto;background:#fff}.tabs button{border:0;border-radius:20px;padding:9px 14px;background:#eef7fa;color:#66818c;white-space:nowrap}.tabs button.active{background:var(--blue);color:#fff}.wrap{padding:14px}.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px #dbeef3}.btn{border:0;border-radius:14px;padding:12px 16px;background:var(--blue);color:#fff;font-weight:700}.empty{text-align:center;padding:60px 20px;color:#8298a1}.fab{position:fixed;right:18px;bottom:25px;width:58px;height:58px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:30px;box-shadow:0 5px 18px #b8dbe5}
</style></head><body>
<header><h1>推しカレンダー</h1></header>
<nav class="tabs"><button class="active">カレンダー</button><button>予定一覧</button><button>人物・作品</button><button>ツアー</button></nav>
<main class="wrap"><section class="card"><h2>準備完了</h2><p>ここから予定・人物・作品を登録していけます。</p><p>白背景＋淡い水色のデザインで統一しています。</p></section>
<section class="card"><h3>これから実装する機能</h3><p>ライブ／イベント／物販／映画／交通／宿泊／その他、チケット・当落・発券・遠征・ツアー・人物別一覧など。</p></section>
</main><button class="fab">＋</button></body></html>
