<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>推しカレンダー</title>

<link rel="manifest" href="manifest.webmanifest">

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#fafafa;
}

/* FAB */
#fab{
  position:fixed;
  right:20px;
  bottom:20px;
  width:60px;
  height:60px;
  background:#ff4081;
  border-radius:50%;
  color:#fff;
  font-size:40px;
  line-height:60px;
  text-align:center;
  cursor:pointer;
}

/* モーダル */
#mb{
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.5);
  display:none;
}
#mb.show{
  display:block;
}
#modal{
  background:#fff;
  width:90%;
  max-width:600px;
  margin:40px auto;
  padding:20px;
  border-radius:10px;
}

/* 一覧 */
.le{
  padding:10px;
  border-bottom:1px solid #ddd;
  cursor:pointer;
}
.ld{ font-weight:bold; }
.lt{ }
.lp{ color:#666; }

/* カレンダー */
.ce{
  padding:10px;
  border-bottom:1px solid #ddd;
  cursor:pointer;
}
.cd{ font-weight:bold; }
.ct{ }

/* 人物 */
.pe{
  padding:10px;
  border-bottom:1px solid #ddd;
  cursor:pointer;
}
.pn{}

/* ツアー */
.te{
  padding:10px;
  border-bottom:1px solid #ddd;
  cursor:pointer;
}
.tn{}
</style>
</head>

<body>

<h2>推しカレンダー</h2>

<div id="calendar"></div>
<hr>
<div id="list"></div>
<hr>
<h3>人物</h3>
<div id="people"></div>
<hr>
<h3>ツアー</h3>
<div id="tours"></div>

<div id="fab">＋</div>

<div id="mb"><div id="modal"></div></div>

<script src="script.js"></script>
</body>
</html>
